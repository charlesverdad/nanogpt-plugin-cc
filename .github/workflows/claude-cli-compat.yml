name: claude-cli compat

# Verifies that the Claude Code command surface this plugin depends on
# (flags parsed from `claude --help`) still exists across recent Claude Code
# releases. If a Claude Code version drops a flag we rely on, the matching
# matrix job fails loudly in its own log.
#
# The offline contract test (tests/cli-contract.test.mjs) runs in the normal
# CI workflow; this workflow exercises the SAME manifest against REAL installed
# Claude Code versions via plugins/nano/scripts/check-cli-contract.mjs. It also
# runs the offline permission-boundary regression test against each version.

on:
  # Re-validate whenever the manifest or contract code changes.
  pull_request:
    paths:
      - "plugins/nano/scripts/lib/cli-contract.mjs"
      - "plugins/nano/scripts/check-cli-contract.mjs"
      - "plugins/nano/scripts/lib/runtime.mjs"
      - "tests/cli-contract.test.mjs"
      - "tests/real-claude-boundary.test.mjs"
      - "tests/fake-anthropic-server.mjs"
      - ".github/workflows/claude-cli-compat.yml"
  # Catch upstream Claude Code releases that break us.
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compat:
    name: claude-cli ${{ matrix.claude-version }}
    runs-on: ubuntu-latest
    # Non-blocking: @anthropic-ai/claude-code is a third-party npm package and
    # its install surface (Node version floor, package availability, install
    # name) can change without notice. We do NOT want an install hiccup in a
    # third-party dependency to block PR merges. Real contract regressions
    # still show up as a red job in this workflow's log and on the scheduled
    # runs. Make this a required check only once the install path has proven
    # stable.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # Recent Claude Code releases on npm. The pinned floor is 2.1.278,
        # which is the minimum version the plugin supports (every flag/value
        # the plugin uses is present from 2.1.278). "latest" tracks the newest
        # release. Add/trim versions as Claude Code ships new releases; if a
        # future older floor drops a flag, remove it from this list rather
        # than leaving the job red.
        claude-version:
          - "2.1.278"
          - "latest"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      # Install method: Claude Code is published to npm as
      # @anthropic-ai/claude-code (https://www.npmjs.com/package/@anthropic-ai/claude-code).
      # We pin the exact version under test (or "latest" to track new releases).
      # NOTE: if a future release changes the install surface (e.g. a new
      # package name or a Node floor bump), adjust this step.
      - name: Install @anthropic-ai/claude-code ${{ matrix.claude-version }}
        run: npm install -g @anthropic-ai/claude-code@${{ matrix.claude-version }}

      - name: Show installed claude version
        run: claude --version || true

      - name: Verify plugin command contract against installed Claude Code
        run: node plugins/nano/scripts/check-cli-contract.mjs

      # Drives the installed claude with the default `write` profile against a
      # scripted fake Anthropic endpoint (offline, fake key, $0) and checks the
      # permission boundary: git --output escapes, writes outside cwd and .git
      # edits are denied; git status and ls still run.
      - name: Permission boundary regression (real claude, fake endpoint)
        env:
          NANO_REAL_CLAUDE: "1"
        run: node --test tests/real-claude-boundary.test.mjs
